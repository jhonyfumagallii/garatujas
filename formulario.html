<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="formulario.css">
</head>
<body>
    <h1>Formulário de Candidatura a Engenheiro de Software</h1>
    <form method="POST" autocomplete="on">
        <fieldset>
            <legend>Dados Pessoais</legend>
            <p class="nome-linha">
                <p class="nome-grupo">
                    <label for="nome">Nome:</label>
                    <input type="text" name="nome" id="nome" required>
                </p>
                <p class="nome-grupo">
                    <label for="sobrenome">Sobrenome:</label>
                    <input type="text" name="sobrenome" id="sobrenome" required>
                </p>
            </p>
            <p>
                <label for= "email">Seu e-mail:</label>
                <input type="email" name="email" id="email" placeholder="examplo@email.com" autocomplete="email" required>
            </p>
            <p>
                <label for="tel">Seu número de telefone:</label>
                <input type="tel" name="tel" id="tel" autocomplete="tel" placeholder="DD 99999-9999" pattern="\d{2}\s\d{4,5}-\d{4,5}" required>
            </p>
            <p>
                Sexo:
                <select name="sexo" required>
                    <option value="" selected disabled>Selecione uma opção</option>
                    <option>Masculino</option>
                    <option>Feminino</option>
                    <option>Prefiro não dizer</option>
                </select>
            </p>
        </fieldset>
        <p>
            <label for="porque">Por que você acha que seria uma boa opção para nossa equipe?</label><br>
            <textarea id="porque" name="porque" placeholder="Sua mensagem aqui..." required></textarea>
        </p>
        <p>
            <label for="entusiasma">O que mais te entusiasma neste trabalho?</label><br>
            <textarea id="entusiasma" name="entusiasma" placeholder="Sua mensagem aqui..." required></textarea><br>
        </p>
        <p>
            <label for="curriculo">Envie seu currículo, por favor.</label><br>
            <input type="file" name="curriculo" id="curriculo" required>
        </p>
        <div>
            <button type="submit">Enviar</button>
        <div>
  </form>
</body>
</html>
